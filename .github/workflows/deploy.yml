name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling them: a run killed mid-deploy leaves
# the Pages deployment stuck in progress, which makes the next run fail with 400.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          CUSTOM_DOMAIN: "true"
        run: npm run build

      - name: Verify export
        run: |
          set -e
          for f in out/index.html out/services/index.html out/en/index.html out/CNAME; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          if grep -q '__next_error__' out/index.html; then
            echo "out/index.html is the error shell — the ka hoist did not run"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
